[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "presidio-ko"
version = "0.1.0"
description = "Korean phone number and bank account recognizers for Microsoft Presidio"
requires-python = ">=3.10"
dependencies = ["presidio-analyzer>=2.2.364"]

[project.optional-dependencies]
test = ["pytest"]
