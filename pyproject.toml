[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presidio-ko"
version = "0.1.0"
description = "Korean phone number and bank account recognizers and a Korean context enhancer for Microsoft Presidio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["presidio-analyzer>=2.2.364"]

[project.optional-dependencies]
test = ["pytest"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
