[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presidio-ko"
version = "0.2.0"
description = "Korean PII detection, Korean-style masking and reversible pseudonymization for Microsoft Presidio"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["presidio-analyzer>=2.2.364", "presidio-anonymizer>=2.2.364"]
keywords = ["presidio", "pii", "korean", "anonymization", "privacy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Korean",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Repository = "https://github.com/Bin0917/presidio-ko"
Issues = "https://github.com/Bin0917/presidio-ko/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
